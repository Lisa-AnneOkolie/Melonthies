<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Melonthies — Leave a review</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --rind:#2D6A2F; --flesh:#F7C59F; --flesh-soft:#FBE0C6;
    --watermelon:#E8473F; --watermelon-deep:#C3372F; --seed:#1A1A1A; --mist:#F0F7F0; --white:#FFFFFF;
    --display:'Syne', sans-serif; --body:'Instrument Sans', sans-serif;
    --radius-lg:28px; --radius-md:18px;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{font-family:var(--body); background:var(--mist); color:var(--seed); line-height:1.5; padding:32px 20px 80px; -webkit-font-smoothing:antialiased;}
  h2{font-family:var(--display); font-weight:800; letter-spacing:-0.01em;}
  .wrap{max-width:820px; margin:0 auto;}
  .eyebrow{font-weight:700; text-transform:uppercase; letter-spacing:0.14em; font-size:0.72rem; color:var(--watermelon);}
  button{font-family:var(--body); cursor:pointer;}
  .btn{display:inline-flex; align-items:center; gap:8px; font-weight:700; font-size:0.95rem; padding:13px 24px; border-radius:999px; border:2px solid transparent; transition:transform 0.15s ease, background 0.15s ease;}
  .btn:hover{transform:translateY(-2px);}
  .btn-primary{background:var(--watermelon); color:var(--white);}
  .btn-primary:hover{background:var(--watermelon-deep);}
  .btn:disabled{opacity:0.5; cursor:not-allowed; transform:none;}
  .form-card{background:var(--white); border-radius:var(--radius-lg); padding:32px 30px; max-width:520px; box-shadow:0 14px 32px rgba(29,74,32,0.1); margin:0 auto;}
  .form-card h2{color:var(--rind); margin-bottom:6px;}
  .form-card p.sub{color:#666; font-size:0.9rem; margin-bottom:22px;}
  label{display:block; font-size:0.8rem; font-weight:700; margin:16px 0 6px; color:var(--seed);}
  input[type=text], textarea, select{width:100%; font-family:var(--body); font-size:0.95rem; padding:11px 14px; border:1.5px solid #ddd; border-radius:12px; background:var(--mist);}
  textarea{min-height:110px; resize:vertical;}
  .star-picker{display:flex; gap:6px; font-size:1.8rem; color:#ddd; cursor:pointer; margin-top:4px;}
  .star-picker span.on{color:var(--watermelon);}
  .form-card .btn{width:100%; justify-content:center; margin-top:22px;}
  .invalid-token{text-align:center; padding:40px 20px; color:#888;}
  .invalid-token .icon{font-size:2.2rem; margin-bottom:12px;}
  .success-msg{text-align:center; padding:20px 0;}
  .success-msg .icon{font-size:2.4rem; color:var(--rind); margin-bottom:10px;}
</style>
</head>
<body>
<div class="wrap">
  <div class="form-card" id="submitCard">Loading…</div>
</div>

<script>
// ⚠️ Paste your deployed Apps Script Web App URL here (ends in /exec)
const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxpRrefED1YaCJC_hmajFVgLEpjKVVZG9inyjdFiiHiN8Ib1T9ty3HP4goB1pLXKdUP/exec";

function esc(s){ return (s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

async function loadSubmitView(){
  const card = document.getElementById('submitCard');
  const params = new URLSearchParams(location.search);
  const token = params.get('token');

  if(!token){
    card.innerHTML = `<div class="invalid-token"><div class="icon">🍉</div><p>No review link provided.<br>Please use the link we sent you on WhatsApp.</p></div>`;
    return;
  }

  let tokenData = null;
  try{
    const r = await fetch(`${APPS_SCRIPT_URL}?action=getTokenData&token=${encodeURIComponent(token)}`);
    tokenData = await r.json();
  }catch(e){}

  if(!tokenData){
    card.innerHTML = `<div class="invalid-token"><div class="icon">⚠️</div><p>This review link isn't valid. It may have expired — reach out to us on WhatsApp for a new one.</p></div>`;
    return;
  }
  if(tokenData.used){
    card.innerHTML = `<div class="invalid-token"><div class="icon">✓</div><p>This link has already been used. Thanks for your review!</p></div>`;
    return;
  }

  card.innerHTML = `
    <p class="eyebrow">Verified order</p>
    <h2>Hi ${esc(tokenData.customerName)}, how was it?</h2>
    <p class="sub">Your feedback helps other people decide what to try.</p>

    <label>Your rating</label>
    <div class="star-picker" id="starPicker">
      <span data-v="1">★</span><span data-v="2">★</span><span data-v="3">★</span><span data-v="4">★</span><span data-v="5">★</span>
    </div>

    <label>Which flavor did you order?</label>
    <select id="flavorSelect">
      <option value="">Select a flavor</option>
      <option>Original Red</option>
      <option>Golden Glow</option>
      <option>Pink Dusk</option>
      <option>Rush Hour</option>
      <option>Tropic Blaze</option>
      <option>Midnight Bliss</option>
    </select>

    <label>Your review</label>
    <textarea id="reviewText" placeholder="Tell us what you thought..."></textarea>

    <button class="btn btn-primary" id="submitReviewBtn">Submit review</button>
  `;

  let rating = 0;
  const picker = document.getElementById('starPicker');
  picker.addEventListener('click', e=>{
    const s = e.target.closest('span');
    if(!s) return;
    rating = parseInt(s.dataset.v);
    picker.querySelectorAll('span').forEach(sp=>{
      sp.classList.toggle('on', parseInt(sp.dataset.v) <= rating);
    });
  });

  document.getElementById('submitReviewBtn').addEventListener('click', async ()=>{
    const btn = document.getElementById('submitReviewBtn');
    const text = document.getElementById('reviewText').value.trim();
    const flavor = document.getElementById('flavorSelect').value;
    if(rating === 0){ alert('Please pick a star rating.'); return; }
    if(!text){ alert('Please write a short review.'); return; }

    btn.disabled = true;
    btn.textContent = 'Submitting…';

    try{
      const r = await fetch(APPS_SCRIPT_URL, {
        method: 'POST',
        body: JSON.stringify({ action:'submitReview', token, rating, flavor, text })
      });
      const result = await r.json();
      if(result.error) throw new Error(result.error);

      card.innerHTML = `<div class="success-msg"><div class="icon">🍉</div>
        <h2>Thanks, ${esc(tokenData.customerName)}!</h2>
        <p style="color:#666; margin-top:6px;">${result.status==='pending' ? 'Your review is in for a quick check and will appear on the site soon.' : 'Your review is live on the site now.'}</p></div>`;
    }catch(e){
      alert('Something went wrong submitting your review. Please try again.');
      btn.disabled = false;
      btn.textContent = 'Submit review';
    }
  });
}

loadSubmitView();
</script>
</body>
</html>
