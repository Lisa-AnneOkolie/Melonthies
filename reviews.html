<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Melonthies — Reviews</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --rind:#2D6A2F; --rind-deep:#1D4A20; --flesh:#F7C59F; --flesh-soft:#FBE0C6;
    --watermelon:#E8473F; --watermelon-deep:#C3372F; --seed:#1A1A1A; --mist:#F0F7F0; --white:#FFFFFF;
    --display:'Syne', sans-serif; --body:'Instrument Sans', sans-serif;
    --radius-lg:28px; --radius-md:18px;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{font-family:var(--body); background:var(--mist); color:var(--seed); line-height:1.5; padding:32px 20px 80px; -webkit-font-smoothing:antialiased;}
  h1,h2,h3{font-family:var(--display); font-weight:800; letter-spacing:-0.01em;}
  .wrap{max-width:820px; margin:0 auto;}
  .eyebrow{font-weight:700; text-transform:uppercase; letter-spacing:0.14em; font-size:0.72rem; color:var(--watermelon);}
  .reviews-hero{margin-bottom:32px;}
  .reviews-hero h2{font-size:clamp(1.8rem,3.4vw,2.4rem); margin-top:10px;}
  .reviews-hero p{color:#4a4a44; margin-top:10px; max-width:56ch;}
  .rating-summary{display:flex; align-items:center; gap:20px; margin-top:22px; background:var(--white); border-radius:var(--radius-lg); padding:22px 26px; box-shadow:0 12px 30px rgba(29,74,32,0.08);}
  .rating-big{font-family:var(--display); font-weight:800; font-size:2.6rem; color:var(--rind);}
  .stars{color:var(--watermelon); font-size:1.1rem; letter-spacing:2px;}
  .rating-summary .meta{font-size:0.85rem; color:#666; margin-top:4px;}
  .review-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(240px,1fr)); gap:18px; margin-top:24px;}
  .review-card{background:var(--white); border-radius:var(--radius-md); padding:20px 22px; box-shadow:0 10px 24px rgba(29,74,32,0.07);}
  .review-card .stars{font-size:0.95rem; margin-bottom:8px; display:block;}
  .review-card p.text{font-size:0.92rem; color:#3a3a35; margin-bottom:14px;}
  .review-card .who{display:flex; justify-content:space-between; align-items:center; font-size:0.78rem; color:#888;}
  .review-card .flavor-tag{display:inline-block; background:var(--mist); color:var(--rind); font-weight:700; font-size:0.7rem; text-transform:uppercase; letter-spacing:0.06em; padding:4px 10px; border-radius:999px;}
  .verified{display:inline-flex; align-items:center; gap:4px; color:var(--rind); font-weight:600; font-size:0.72rem;}
  .empty{color:#888; font-size:0.9rem; padding:20px 0;}
</style>
</head>
<body>
<div class="wrap">
  <section>
    <div class="reviews-hero">
      <p class="eyebrow">From real customers</p>
      <h2>What people are saying</h2>
      <p>Every review here comes from someone who actually ordered a Melonthies smoothie.</p>
      <div class="rating-summary">
        <div><div class="rating-big" id="avgRating">—</div></div>
        <div>
          <div class="stars" id="avgStars">☆☆☆☆☆</div>
          <div class="meta" id="reviewCount">Loading…</div>
        </div>
      </div>
    </div>
    <div class="review-grid" id="reviewGrid"></div>
    <div class="empty" id="reviewEmpty" style="display:none;">No approved reviews yet — be the first to try one of our flavors.</div>
  </section>
</div>

<script>
// ⚠️ Paste your deployed Apps Script Web App URL here (ends in /exec)
const APPS_SCRIPT_URL = "PASTE_YOUR_WEB_APP_URL_HERE";

function esc(s){ return (s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function starString(n){ return '★★★★★☆☆☆☆☆'.slice(5-n,10-n); }

async function loadReviews(){
  let reviews = [];
  try{
    const r = await fetch(`${APPS_SCRIPT_URL}?action=getApprovedReviews`);
    reviews = await r.json();
    if(reviews.error) throw new Error(reviews.error);
  }catch(e){
    document.getElementById('reviewCount').textContent = 'Couldn\'t load reviews right now.';
    return;
  }

  const grid = document.getElementById('reviewGrid');
  const empty = document.getElementById('reviewEmpty');
  grid.innerHTML = '';

  if(!reviews.length){
    empty.style.display = 'block';
    document.getElementById('reviewCount').textContent = 'No reviews yet';
    return;
  }
  empty.style.display = 'none';

  const avg = reviews.reduce((s,r)=>s+Number(r.rating),0) / reviews.length;
  document.getElementById('avgRating').textContent = avg.toFixed(1);
  document.getElementById('avgStars').textContent = starString(Math.round(avg));
  document.getElementById('reviewCount').textContent = `Based on ${reviews.length} review${reviews.length===1?'':'s'}`;

  reviews.forEach(rev=>{
    const card = document.createElement('div');
    card.className = 'review-card';
    card.innerHTML = `
      <span class="stars">${starString(rev.rating)}</span>
      <p class="text">"${esc(rev.text)}"</p>
      <div class="who">
        <span>${esc(rev.customerName)} <span class="verified">✓ verified</span></span>
        ${rev.flavor ? `<span class="flavor-tag">${esc(rev.flavor)}</span>` : ''}
      </div>`;
    grid.appendChild(card);
  });
}

loadReviews();
</script>
</body>
</html>
